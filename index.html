<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5eee5">
  <meta name="description" content="دعوة خطوبة ابتهال ومهدي">
  <title>ابتهال & مهدي | دعوة خطوبة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="cover-page">
  <main class="cover-screen">
    <picture class="cover-art" aria-hidden="true">
      <source media="(max-width: 768px)" srcset="assets/invitation-mobile.png">
      <img src="assets/invitation-desktop.png" alt="">
    </picture>

    <div class="cover-overlay"></div>

    <div class="cover-content">
      <div class="cover-mini-title" data-i18n="coverTitle">دعوة خطوبة</div>
      <div class="cover-names">
        <span data-config="bride">ابتهال</span>
        <b>&amp;</b>
        <span data-config="groom">مهدي</span>
      </div>

      <button class="open-invitation" id="openInvitation" type="button" data-i18n="openButton">
        Ouvrir l'invitation
        <span class="button-seal">✦</span>
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
